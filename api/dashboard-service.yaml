openapi: 3.1.0
info:
  title: Intelligent Monitoring API
  version: 1.0.0
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        correlationId: {type: string, format: uuid}
    MetricSample:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: {type: string, format: date-time}
        value: {type: number}
paths:
  /api/v1/dashboards:
    post:
      tags: [public]
      summary: Создать дашборд
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: {name: {type: string}}
            example: {name: Production overview}
    get:
      tags: [public]
      summary: Получить список дашбордов
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Список дашбордов}
